all:
  vars:
    ansible_user: admin
    ansible_ssh_private_key_file: /home/admin/id-rda-infra.key
  children:
    my_infra:
      vars:
        ufw_rules:
          - { port: 80, from: 192.168.50.0/24 }
          - { port: 9100, from: 192.168.50.13/32 }
      hosts:
        app-dev:
          ansible_host: 192.168.50.10
        app-prod1:
          ansible_host: 192.168.50.11
    ci:
      vars:
        ufw_rules:
          - { port: 8080, from: 192.168.50.0/24 }
          - { port: 9100, from: 192.168.50.13/32 }
      hosts:
        jenkins:
          ansible_host: 192.168.50.12
    monitoring:
      vars:
        ufw_rules:
          - { port: 3000, from: 192.168.50.0/24 }
          - { port: 9090, from: 192.168.50.0/24 }
          - { port: 3100, from: 192.168.50.0/24 }
        ssh_allowed_from:
          - 192.168.50.0/24
          - 10.0.2.0/24
      hosts:
        monitoring:
          ansible_host: 192.168.50.13