---
- name: Installer et configurer Loki (centralisation des logs)
  hosts: monitoring
  become: true

  tasks:
    - name: Ajouter la clé GPG officielle de Grafana
      ansible.builtin.get_url:
        url: https://apt.grafana.com/gpg.key
        dest: /etc/apt/keyrings/grafana.asc
        mode: "0644"

    - name: Ajouter le dépôt APT officiel de Grafana
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/grafana.asc] https://apt.grafana.com stable main"
        state: present
        filename: grafana

    - name: Installer Loki (paquet officiel)
      ansible.builtin.apt:
        name: loki
        state: present
        update_cache: true

    - name: Créer le répertoire de données Loki avec les bons droits
      ansible.builtin.file:
        path: /var/lib/loki
        state: directory
        owner: loki
        group: nogroup
        mode: "0750"
        
    - name: Configurer Loki
      ansible.builtin.copy:
        dest: /etc/loki/config.yml
        mode: "0644"
        content: |
          auth_enabled: false

          server:
            http_listen_port: 3100

          common:
            path_prefix: /var/lib/loki
            storage:
              filesystem:
                chunks_directory: /var/lib/loki/chunks
                rules_directory: /var/lib/loki/rules
            replication_factor: 1
            ring:
              kvstore:
                store: inmemory

          schema_config:
            configs:
              - from: 2024-01-01
                store: tsdb
                object_store: filesystem
                schema: v13
                index:
                  prefix: index_
                  period: 24h
      notify: Restart loki

    - name: Activer et démarrer Loki
      ansible.builtin.systemd:
        name: loki
        enabled: true
        state: started

  handlers:
    - name: Restart loki
      ansible.builtin.systemd:
        name: loki
        state: restarted